<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rock Hall Search</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(to bottom, #1a1a1a 0%, #0b0b0b 90%);
    }
    h1 {
      margin-top: 40px;
      text-align: center;
      font-size: 2.2rem;
      text-shadow: 2px 2px 6px #000;
    }
    .search-container {
      display: flex;
      justify-content: center;
      margin: 30px 0;
      width: 80%;
      max-width: 700px;
    }
    input {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 8px 0 0 8px;
      outline: none;
    }
    button {
      padding: 12px 18px;
      font-size: 20px;
      border: none;
      border-radius: 0 8px 8px 0;
      cursor: pointer;
      background: #d32f2f;
      color: #fff;
      transition: 0.3s;
    }
    button:hover {
      background: #b71c1c;
    }
    ul {
      list-style: none;
      padding: 0;
      width: 90%;
      max-width: 900px;
    }
    li {
      display: flex;
      align-items: center;
      background: #1e1e1e;
      margin: 10px 0;
      padding: 12px;
      border-radius: 10px;
      transition: transform 0.2s;
    }
    li:hover {
      transform: scale(1.02);
    }
    li img {
      width: 80px;
      height: 80px;
      border-radius: 8px;
      object-fit: cover;
      margin-right: 15px;
      border: 2px solid #ffd700;
    }
    .info h3 {
      margin: 0;
      font-size: 18px;
      color: #ffd700;
    }
    .info p {
      margin: 6px 0 0;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>🎸 Rock & Roll Hall of Fame Search</h1>

  <div class="search-container">
    <input id="searchInput" placeholder="Enter artist name..." />
    <button id="searchButton">🎸</button>
  </div>

  <ul id="results"></ul>

  <script>
    const artists = [
      { name: "The Who", year: 1990, genre: "Rock", img: "https://upload.wikimedia.org/wikipedia/commons/9/9c/The_Who_2010.jpg" },
      { name: "Simon & Garfunkel", year: 1990, genre: "Folk Rock", img: "https://upload.wikimedia.org/wikipedia/commons/6/6d/Simon_and_Garfunkel_1966.jpg" },
      { name: "The Doors", year: 1993, genre: "Rock", img: "https://upload.wikimedia.org/wikipedia/commons/2/28/The_Doors_1968.JPG" },
      { name: "Led Zeppelin", year: 1995, genre: "Hard Rock", img: "https://upload.wikimedia.org/wikipedia/commons/3/3c/Led_Zeppelin_1977.jpg" },
      { name: "Pink Floyd", year: 1996, genre: "Progressive Rock", img: "https://upload.wikimedia.org/wikipedia/commons/5/51/Pink_Floyd_1973.jpg" },
      { name: "The Eagles", year: 1998, genre: "Rock", img: "https://upload.wikimedia.org/wikipedia/commons/f/f3/Eagles_-_1975.jpg" },
      { name: "Billy Joel", year: 1999, genre: "Pop Rock", img: "https://upload.wikimedia.org/wikipedia/commons/0/0e/Billy_Joel_2007.jpg" },
      { name: "Eric Clapton", year: 2000, genre: "Blues Rock", img: "https://upload.wikimedia.org/wikipedia/commons/2/2a/Eric_Clapton_2015.jpg" },
      { name: "Aerosmith", year: 2001, genre: "Hard Rock", img: "https://upload.wikimedia.org/wikipedia/commons/6/6b/Aerosmith_2010.jpg" },
      { name: "Elvis Costello", year: 2003, genre: "New Wave", img: "https://upload.wikimedia.org/wikipedia/commons/f/f3/Elvis_Costello_2009.jpg" },
      { name: "Prince", year: 2004, genre: "Funk/Rock", img: "https://upload.wikimedia.org/wikipedia/commons/f/f4/Prince_in_2007.jpg" },
      { name: "U2", year: 2005, genre: "Rock", img: "https://upload.wikimedia.org/wikipedia/commons/5/56/U2_in_2015.jpg" },
      { name: "Eminem", year: 2022, genre: "Hip-Hop", img: "https://upload.wikimedia.org/wikipedia/commons/1/1b/Eminem_2014.jpg" },
      { name: "Black Sabbath", year: 2006, genre: "Heavy Metal", img: "https://upload.wikimedia.org/wikipedia/commons/9/9f/BlackSabbathMontage.jpg" },
      { name: "Blondie", year: 2006, genre: "New Wave", img: "https://upload.wikimedia.org/wikipedia/commons/3/31/Blondie_2017.jpg" },
      { name: "R.E.M.", year: 2007, genre: "Alternative Rock", img: "https://upload.wikimedia.org/wikipedia/commons/9/99/REM_2011.jpg" },
      { name: "Van Halen", year: 2007, genre: "Hard Rock", img: "https://upload.wikimedia.org/wikipedia/commons/2/27/Van_Halen_2008.jpg" },
      { name: "The Police", year: 2003, genre: "Rock", img: "https://upload.wikimedia.org/wikipedia/commons/9/9f/ThePolice2008.jpg" },
      { name: "AC/DC", year: 2003, genre: "Hard Rock", img: "https://upload.wikimedia.org/wikipedia/commons/8/87/ACDC-Live.jpg" },
      { name: "The Clash", year: 2003, genre: "Punk Rock", img: "https://upload.wikimedia.org/wikipedia/commons/b/b9/The_Clash_Live.jpg" },
      { name: "Metallica", year: 2009, genre: "Metal", img: "https://upload.wikimedia.org/wikipedia/commons/0/0c/Metallica_2019.jpg" },
      { name: "Run-D.M.C.", year: 2009, genre: "Hip-Hop", img: "https://upload.wikimedia.org/wikipedia/commons/9/9c/Run-DMC_%281984%29.jpg" },
      { name: "Green Day", year: 2015, genre: "Punk Rock", img: "https://upload.wikimedia.org/wikipedia/commons/3/30/Green_Day_2016.jpg" },
      { name: "Nirvana", year: 2014, genre: "Grunge", img: "https://upload.wikimedia.org/wikipedia/commons/6/66/Nirvana_around_1992.jpg" },
      { name: "Red Hot Chili Peppers", year: 2012, genre: "Alternative Rock", img: "https://upload.wikimedia.org/wikipedia/commons/6/67/Red_Hot_Chili_Peppers_.jpg" },
      { name: "Beastie Boys", year: 2012, genre: "Hip-Hop", img: "https://upload.wikimedia.org/wikipedia/commons/7/75/Beastie_Boys_2011.jpg" },
      { name: "Guns N' Roses", year: 2012, genre: "Hard Rock", img: "https://upload.wikimedia.org/wikipedia/commons/6/6c/Guns_N'_Roses_2017.jpg" },
      { name: "Public Enemy", year: 2013, genre: "Hip-Hop", img: "https://upload.wikimedia.org/wikipedia/commons/5/5c/Public_Enemy.jpg" },
      { name: "Radiohead", year: 2019, genre: "Alternative Rock", img: "https://upload.wikimedia.org/wikipedia/commons/5/5f/Radiohead_2018.jpg" },
      { name: "The Cure", year: 2019, genre: "Post-Punk", img: "https://upload.wikimedia.org/wikipedia/commons/f/fc/The_Cure_%281992%29.jpg" },
      { name: "Janet Jackson", year: 2019, genre: "Pop/R&B", img: "https://upload.wikimedia.org/wikipedia/commons/8/80/Janet_Jackson_2019.jpg" },
      { name: "Tupac Shakur", year: 2017, genre: "Hip-Hop", img: "https://upload.wikimedia.org/wikipedia/commons/3/38/Tupac_Shakur_by_Kadir_Nelson.jpg" },
      { name: "The Notorious B.I.G.", year: 2020, genre: "Hip-Hop", img: "https://upload.wikimedia.org/wikipedia/commons/5/53/The_Notorious_B.I.G._%28cropped%29.jpg" }
    ];

    const input = document.getElementById("searchInput");
    const button = document.getElementById("searchButton");
    const results = document.getElementById("results");

    function search() {
      const q = input.value.toLowerCase().trim();
      results.innerHTML = "";
      if (!q) return;
      const found = artists.filter(a => a.name.toLowerCase().includes(q));
      if (found.length === 0) {
        results.innerHTML = "<li style='color:#ffd;'>No results found</li>";
        return;
      }
      found.forEach(a => {
        const li = document.createElement("li");
        li.innerHTML = `
          <img src="${a.img}" alt="${a.name}">
          <div class="info"><h3>${a.name}</h3>
          <p>Inducted in ${a.year}, known for ${a.genre}</p></div>
        `;
        results.appendChild(li);
      });
    }

    button.addEventListener("click", search);
    input.addEventListener("keypress", e => { if (e.key === "Enter") search(); });
  </script>
</body>
</html>
