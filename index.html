<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rock Hall Search</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: url('https://images.unsplash.com/photo-1524041256114-9c06e8d0a9e3?fit=crop&w=1400&q=80') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      backdrop-filter: brightness(0.6);
    }
    h1 {
      margin-top: 40px;
      text-shadow: 2px 2px 5px #000;
      text-align: center;
    }
    .search-container {
      margin: 40px 0;
      display: flex;
      justify-content: center;
      width: 80%;
      max-width: 600px;
    }
    input {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 8px 0 0 8px;
      outline: none;
    }
    button {
      padding: 12px;
      font-size: 18px;
      border: none;
      border-radius: 0 8px 8px 0;
      cursor: pointer;
      background: #d32f2f;
      color: #fff;
      transition: 0.3s;
    }
    button:hover {
      background: #b71c1c;
    }
    ul {
      list-style: none;
      padding: 0;
      width: 90%;
      max-width: 800px;
    }
    li {
      display: flex;
      align-items: center;
      background: rgba(0,0,0,0.6);
      margin: 10px 0;
      padding: 10px;
      border-radius: 10px;
    }
    li img {
      width: 80px;
      height: 80px;
      border-radius: 8px;
      object-fit: cover;
      margin-right: 15px;
      border: 2px solid #fff;
    }
    li .info {
      text-align: left;
    }
    li .info h3 {
      margin: 0;
      font-size: 18px;
      color: #ffd700;
    }
    li .info p {
      margin: 4px 0 0;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>🎸 Rock & Roll Hall of Fame</h1>

  <div class="search-container">
    <input id="searchInput" placeholder="Enter artist name..." />
    <button id="searchButton">🎸</button>
  </div>

  <ul id="results"></ul>

  <script>
    const inductees = [
      { name: "The Who", year: 1990, genre: "Rock", img: "https://source.unsplash.com/80x80/?thewho,rock" },
      { name: "Simon & Garfunkel", year: 1990, genre: "Folk Rock", img: "https://source.unsplash.com/80x80/?simon,garfunkel" },
      { name: "The Doors", year: 1993, genre: "Rock", img: "https://source.unsplash.com/80x80/?thedoors" },
      { name: "Led Zeppelin", year: 1995, genre: "Hard Rock", img: "https://source.unsplash.com/80x80/?ledzeppelin" },
      { name: "Pink Floyd", year: 1996, genre: "Progressive Rock", img: "https://source.unsplash.com/80x80/?pinkfloyd" },
      { name: "The Eagles", year: 1998, genre: "Rock", img: "https://source.unsplash.com/80x80/?theeagles" },
      { name: "Billy Joel", year: 1999, genre: "Pop Rock", img: "https://source.unsplash.com/80x80/?billyjoel" },
      { name: "Eric Clapton", year: 2000, genre: "Blues Rock", img: "https://source.unsplash.com/80x80/?ericclapton" },
      { name: "Aerosmith", year: 2001, genre: "Hard Rock", img: "https://source.unsplash.com/80x80/?aerosmith" },
      { name: "Elvis Costello", year: 2003, genre: "New Wave", img: "https://source.unsplash.com/80x80/?elviscostello" },
      { name: "Prince", year: 2004, genre: "Funk/Rock", img: "https://source.unsplash.com/80x80/?prince" },
      { name: "U2", year: 2005, genre: "Rock", img: "https://source.unsplash.com/80x80/?u2" },
      { name: "Eminem", year: 2022, genre: "Hip-Hop", img: "https://source.unsplash.com/80x80/?eminem" },
      { name: "Black Sabbath", year: 2006, genre: "Heavy Metal", img: "https://source.unsplash.com/80x80/?blacksabbath" },
      { name: "Blondie", year: 2006, genre: "New Wave", img: "https://source.unsplash.com/80x80/?blondieband" },
      { name: "R.E.M.", year: 2007, genre: "Alternative Rock", img: "https://source.unsplash.com/80x80/?remband" },
      { name: "Van Halen", year: 2007, genre: "Hard Rock", img: "https://source.unsplash.com/80x80/?vanhalen" },
      { name: "The Police", year: 2003, genre: "Rock", img: "https://source.unsplash.com/80x80/?thepoliceband" },
      { name: "AC/DC", year: 2003, genre: "Hard Rock", img: "https://source.unsplash.com/80x80/?acdcband" },
      { name: "The Clash", year: 2003, genre: "Punk Rock", img: "https://source.unsplash.com/80x80/?theclash" },
      { name: "Metallica", year: 2009, genre: "Metal", img: "https://source.unsplash.com/80x80/?metallica" },
      { name: "Run-D.M.C.", year: 2009, genre: "Hip-Hop", img: "https://source.unsplash.com/80x80/?run-dmc" },
      { name: "Green Day", year: 2015, genre: "Punk Rock", img: "https://source.unsplash.com/80x80/?greenday" },
      { name: "Nirvana", year: 2014, genre: "Grunge", img: "https://source.unsplash.com/80x80/?nirvana" },
      { name: "Red Hot Chili Peppers", year: 2012, genre: "Alternative Rock", img: "https://source.unsplash.com/80x80/?redhotchilipeppers" },
      { name: "Beastie Boys", year: 2012, genre: "Hip-Hop", img: "https://source.unsplash.com/80x80/?beastieboys" },
      { name: "Guns N' Roses", year: 2012, genre: "Hard Rock", img: "https://source.unsplash.com/80x80/?gunsnroses" },
      { name: "Public Enemy", year: 2013, genre: "Hip-Hop", img: "https://source.unsplash.com/80x80/?publicenemy" },
      { name: "Radiohead", year: 2019, genre: "Alternative Rock", img: "https://source.unsplash.com/80x80/?radiohead" },
      { name: "The Cure", year: 2019, genre: "Post-Punk", img: "https://source.unsplash.com/80x80/?thecure" },
      { name: "Janet Jackson", year: 2019, genre: "Pop/R&B", img: "https://source.unsplash.com/80x80/?janetjackson" },
      { name: "Tupac Shakur", year: 2017, genre: "Hip-Hop", img: "https://source.unsplash.com/80x80/?tupac" },
      { name: "The Notorious B.I.G.", year: 2020, genre: "Hip-Hop", img: "https://source.unsplash.com/80x80/?notoriousbig" }
    ];

    const input = document.getElementById("searchInput");
    const button = document.getElementById("searchButton");
    const results = document.getElementById("results");

    function search() {
      const query = input.value.toLowerCase();
      results.innerHTML = "";
      if (!query) return;
      const filtered = inductees.filter(a => a.name.toLowerCase().includes(query));
      if (filtered.length === 0) {
        results.innerHTML = "<li>No results found</li>";
        return;
      }
      filtered.forEach(a => {
        const li = document.createElement("li");
        li.innerHTML = `
          <img src="${a.img}" alt="${a.name}">
          <div class="info">
            <h3>${a.name}</h3>
            <p>Inducted in ${a.year}, known for ${a.genre}</p>
          </div>
        `;
        results.appendChild(li);
      });
    }

    button.addEventListener("click", search);
    input.addEventListener("keypress", e => { if (e.key === "Enter") search(); });
  </script>
</body>
</html>
