<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rock Hall Search</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(to bottom, #1a1a1a 0%, #0b0b0b 90%);
    }
    h1 {
      margin-top: 40px;
      text-align: center;
      font-size: 2.2rem;
      text-shadow: 2px 2px 6px #000;
    }
    .search-container {
      display: flex;
      justify-content: center;
      margin: 30px 0;
      width: 80%;
      max-width: 700px;
    }
    input {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 8px 0 0 8px;
      outline: none;
    }
    button {
      padding: 12px 18px;
      font-size: 20px;
      border: none;
      border-radius: 0 8px 8px 0;
      cursor: pointer;
      background: #d32f2f;
      color: #fff;
      transition: 0.3s;
    }
    button:hover {
      background: #b71c1c;
    }
    ul {
      list-style: none;
      padding: 0;
      width: 90%;
      max-width: 900px;
    }
    li {
      display: flex;
      align-items: center;
      background: #1e1e1e;
      margin: 10px 0;
      padding: 12px;
      border-radius: 10px;
      transition: transform 0.2s;
    }
    li:hover {
      transform: scale(1.02);
    }
    li img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      margin-right: 15px;
      border: 2px solid #ffd700;
    }
    .info h3 {
      margin: 0;
      font-size: 18px;
      color: #ffd700;
    }
    .info p {
      margin: 6px 0;
      font-size: 14px;
    }
    .info a {
      color: #4fc3f7;
      text-decoration: none;
      font-size: 13px;
    }
    .info a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>🎸 Rock & Roll Hall of Fame Search</h1>

  <div class="search-container">
    <input id="searchInput" placeholder="Enter artist name..." />
    <button id="searchButton">🎸</button>
  </div>

  <ul id="results"></ul>

  <script>
    const artists = [
      { name: "Simon & Garfunkel", year: 1990, genre: "Folk Rock", img: "https://source.unsplash.com/80x80/?Simon and Garfunkel,portrait", link: "https://rockhall.com/inductees/simon-and-garfunkel/" },
      { name: "The Who", year: 1990, genre: "Rock", img: "https://source.unsplash.com/80x80/?The Who,portrait", link: "https://rockhall.com/inductees/the-who/" },
      { name: "The Doors", year: 1993, genre: "Rock", img: "https://source.unsplash.com/80x80/?The Doors,portrait", link: "https://rockhall.com/inductees/the-doors/" },
      { name: "Led Zeppelin", year: 1995, genre: "Hard Rock", img: "https://source.unsplash.com/80x80/?Led Zeppelin,portrait", link: "https://rockhall.com/inductees/led-zeppelin/" },
      { name: "Pink Floyd", year: 1996, genre: "Progressive Rock", img: "https://source.unsplash.com/80x80/?Pink Floyd,portrait", link: "https://rockhall.com/inductees/pink-floyd/" },
      { name: "The Eagles", year: 1998, genre: "Rock", img: "https://source.unsplash.com/80x80/?The Eagles,portrait", link: "https://rockhall.com/inductees/the-eagles/" },
      { name: "Billy Joel", year: 1999, genre: "Pop Rock", img: "https://source.unsplash.com/80x80/?Billy Joel,portrait", link: "https://rockhall.com/inductees/billy-joel/" },
      { name: "Eric Clapton", year: 2000, genre: "Blues Rock", img: "https://source.unsplash.com/80x80/?Eric Clapton,portrait", link: "https://rockhall.com/inductees/eric-clapton/" },
      { name: "Aerosmith", year: 2001, genre: "Hard Rock", img: "https://source.unsplash.com/80x80/?Aerosmith,portrait", link: "https://rockhall.com/inductees/aerosmith/" },
      { name: "Elvis Costello", year: 2003, genre: "New Wave", img: "https://source.unsplash.com/80x80/?Elvis Costello,portrait", link: "https://rockhall.com/inductees/elvis-costello/" },
      { name: "Prince", year: 2004, genre: "Funk/Rock", img: "https://source.unsplash.com/80x80/?Prince,portrait", link: "https://rockhall.com/inductees/prince/" },
      { name: "U2", year: 2005, genre: "Rock", img: "https://source.unsplash.com/80x80/?U2,portrait", link: "https://rockhall.com/inductees/u2/" },
      { name: "Eminem", year: 2022, genre: "Hip-Hop", img: "https://source.unsplash.com/80x80/?Eminem,portrait", link: "https://rockhall.com/inductees/eminem/" },
      { name: "Black Sabbath", year: 2006, genre: "Heavy Metal", img: "https://source.unsplash.com/80x80/?Black Sabbath,portrait", link: "https://rockhall.com/inductees/black-sabbath/" },
      { name: "Blondie", year: 2006, genre: "New Wave", img: "https://source.unsplash.com/80x80/?Blondie,portrait", link: "https://rockhall.com/inductees/blondie/" },
      { name: "R.E.M.", year: 2007, genre: "Alternative Rock", img: "https://source.unsplash.com/80x80/?REM,portrait", link: "https://rockhall.com/inductees/r-e-m/" },
      { name: "Van Halen", year: 2007, genre: "Hard Rock", img: "https://source.unsplash.com/80x80/?Van Halen,portrait", link: "https://rockhall.com/inductees/van-halen/" },
      { name: "AC/DC", year: 2003, genre: "Hard Rock", img: "https://source.unsplash.com/80x80/?ACDC,portrait", link: "https://rockhall.com/inductees/ac-dc/" },
      { name: "The Clash", year: 2003, genre: "Punk Rock", img: "https://source.unsplash.com/80x80/?The Clash,portrait", link: "https://rockhall.com/inductees/the-clash/" },
      { name: "Metallica", year: 2009, genre: "Metal", img: "https://source.unsplash.com/80x80/?Metallica,portrait", link: "https://rockhall.com/inductees/metallica/" },
      { name: "Run-D.M.C.", year: 2009, genre: "Hip-Hop", img: "https://source.unsplash.com/80x80/?Run DMC,portrait", link: "https://rockhall.com/inductees/run-d-m-c/" },
      { name: "Green Day", year: 2015, genre: "Punk Rock", img: "https://source.unsplash.com/80x80/?Green Day,portrait", link: "https://rockhall.com/inductees/green-day/" },
      { name: "Nirvana", year: 2014, genre: "Grunge", img: "https://source.unsplash.com/80x80/?Nirvana,portrait", link: "https://rockhall.com/inductees/nirvana/" },
      { name: "Red Hot Chili Peppers", year: 2012, genre: "Alternative Rock", img: "https://source.unsplash.com/80x80/?Red Hot Chili Peppers,portrait", link: "https://rockhall.com/inductees/red-hot-chili-peppers/" },
      { name: "Beastie Boys", year: 2012, genre: "Hip-Hop", img: "https://source.unsplash.com/80x80/?Beastie Boys,portrait", link: "https://rockhall.com/inductees/beastie-boys/" },
      { name: "Guns N' Roses", year: 2012, genre: "Hard Rock", img: "https://source.unsplash.com/80x80/?Guns N Roses,portrait", link: "https://rockhall.com/inductees/guns-n-roses/" },
      { name: "Public Enemy", year: 2013, genre: "Hip-Hop", img: "https://source.unsplash.com/80x80/?Public Enemy,portrait", link: "https://rockhall.com/inductees/public-enemy/" },
      { name: "Radiohead", year: 2019, genre: "Alternative Rock", img: "https://source.unsplash.com/80x80/?Radiohead,portrait", link: "https://rockhall.com/inductees/radiohead/" },
      { name: "The Cure", year: 2019, genre: "Post-Punk", img: "https://source.unsplash.com/80x80/?The Cure,portrait", link: "https://rockhall.com/inductees/the-cure/" },
      { name: "Janet Jackson", year: 2019, genre: "Pop/R&B", img: "https://source.unsplash.com/80x80/?Janet Jackson,portrait", link: "https://rockhall.com/inductees/janet-jackson/" },
      { name: "Tupac Shakur", year: 2017, genre: "Hip-Hop", img: "https://source.unsplash.com/80x80/?Tupac Shakur,portrait", link: "https://rockhall.com/inductees/tupac-shakur/" },
      { name: "The Notorious B.I.G.", year: 2020, genre: "Hip-Hop", img: "https://source.unsplash.com/80x80/?Notorious BIG,portrait", link: "https://rockhall.com/inductees/the-notorious-b-i-g/" }
    ];

    const input = document.getElementById("searchInput");
    const button = document.getElementById("searchButton");
    const results = document.getElementById("results");

    function search() {
      const q = input.value.toLowerCase().trim();
      results.innerHTML = "";
      if (!q) return;
      const found = artists.filter(a => a.name.toLowerCase().includes(q));
      if (!found.length) {
        results.innerHTML = "<li style='color: #ffd;'>No results found</li>";
        return;
      }
      found.forEach(a => {
        const li = document.createElement("li");
        li.innerHTML = `
          <img src="${a.img}" alt="${a.name}">
          <div class="info">
            <h3>${a.name}</h3>
            <p>Inducted in ${a.year}, known for ${a.genre}</p>
            <a href="${a.link}" target="_blank">Official Rock Hall Bio</a>
          </div>`;
        results.appendChild(li);
      });
    }

    button.addEventListener("click", search);
    input.addEventListener("keypress", e => { if (e.key === "Enter") search(); });
  </script>
</body>
</html>
